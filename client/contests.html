<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Конкурсы</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="../config.js?v=2"></script>
  <script src="../common.js?v=2"></script>
  <style>
    body {
      background-color: #f3f4f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 80px;
    }
  </style>
</head>

<body class="text-gray-800">
  <div id="loading-screen" class="fixed inset-0 bg-[#f3f4f9] flex items-center justify-center z-50">
    <div class="text-gray-400 text-sm">Загрузка...</div>
  </div>

  <div id="access-denied-screen" class="fixed inset-0 bg-[#f3f4f9] hidden items-center justify-center z-50 px-6">
    <div class="text-center" style="font-family: monospace; font-size: 12px; word-break: break-all; text-align: left;">
      <p><b>Доступ не подтверждён.</b></p>
      <p id="debug-init-data"></p>
    </div>
  </div>

  <div id="app-content" class="hidden">
    <header class="fixed top-0 left-0 right-0 h-14 bg-[#f3f4f9] bg-opacity-90 backdrop-blur-md z-40 flex items-center justify-between px-4">
      <h1 class="text-lg font-semibold text-gray-900 tracking-tight">Конкурсы</h1>
      <button id="refresh-btn" class="p-2 text-indigo-600 rounded-full hover:bg-white/50 transition-colors">
        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
      </button>
    </header>

    <div id="save-toast" class="fixed top-16 left-4 right-4 z-50 hidden">
      <div id="save-toast-inner" class="rounded-xl px-4 py-3 text-sm font-medium text-center shadow-md"></div>
    </div>

    <main class="pt-16 pb-6 px-4 md:px-0 max-w-2xl mx-auto">
      <!-- Баланс -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-1.5 text-sm font-medium text-gray-700">
            <span>🦉</span><span>Совы</span>
          </div>
          <span id="sovy-progress-label" class="text-xs text-gray-400">0/100</span>
        </div>
        <div class="w-full h-2 rounded-full bg-gray-100 overflow-hidden">
          <div id="sovy-progress-bar" class="h-full bg-indigo-500 rounded-full transition-all" style="width:0%"></div>
        </div>
        <div class="flex items-center gap-1.5 text-sm font-medium text-gray-700 mt-3">
          <span>🎟️</span><span>Билеты: <span id="tickets-count">0</span></span>
        </div>
      </div>

      <!-- Рефералка -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
        <div class="text-sm font-semibold text-gray-900 mb-1">🎁 Пригласите друга</div>
        <div id="referral-text" class="text-[12px] text-gray-500 mb-2">Загрузка...</div>
        <div class="flex items-center gap-2">
          <input type="text" id="referral-link-input" readonly
            class="flex-1 min-w-0 px-3 py-2 border border-gray-200 rounded-lg text-xs text-gray-600 bg-gray-50">
          <button id="copy-referral-btn" type="button" class="shrink-0 px-3 py-2 rounded-lg bg-indigo-600 text-white text-xs font-medium">
            Скопировать
          </button>
        </div>
      </div>

      <!-- Лотереи -->
      <div class="text-[11px] text-gray-400 px-1 mb-2">Лотереи</div>
      <div id="lotteries-list"></div>
      <div id="lotteries-empty-message" class="hidden text-center text-sm text-gray-400 py-10 mb-4">Активных лотерей пока нет.</div>

      <!-- Задания -->
      <div class="text-[11px] text-gray-400 px-1 mb-2">Задания</div>
      <div id="tasks-list"></div>
      <div id="empty-message" class="hidden text-center text-sm text-gray-400 py-10">Заданий пока нет.</div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 pb-safe pt-1 px-1 flex justify-between items-end z-40 h-[70px] shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
      <a href="news.html" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="home" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Главная</span>
      </a>
      <a href="questions.html" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="help-circle" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Вопросы</span>
      </a>
      <a href="wishlist.html" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="heart" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Вишлист</span>
      </a>
      <a href="orders.html" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="package" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Заказы</span>
      </a>
      <a href="contests.html" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-indigo-600 pb-2 h-full">
        <i data-lucide="gift" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Конкурсы</span>
      </a>
    </nav>
  </div>

  <!-- Модальное окно отправки доказательства ручного задания -->
  <div id="proof-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-[60] px-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto">
      <div class="p-4 border-b border-gray-100 flex items-center justify-between">
        <h2 id="proof-modal-title" class="text-base font-semibold text-gray-900">Отправить на проверку</h2>
        <button id="proof-modal-close" class="p-1 text-gray-400 hover:text-gray-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-4 space-y-3">
        <p id="proof-modal-description" class="text-xs text-gray-500"></p>
        <div>
          <label class="text-xs font-medium text-gray-500">Текст или ссылка *</label>
          <textarea id="proof-text-input" rows="4"
            class="w-full mt-1 px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:border-indigo-400 resize-none"
            placeholder="Например: ссылка на пост с отзывом"></textarea>
        </div>
      </div>
      <div id="proof-error-text" class="px-4 text-xs text-red-500 hidden"></div>
      <div class="p-4 border-t border-gray-100 flex gap-2">
        <button id="proof-modal-cancel" class="flex-1 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium">Отмена</button>
        <button id="proof-modal-save" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-medium">Отправить</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    initClientAccess(initApp);

    let reloadAll = null;

    function initApp() {
      const tasksList = document.getElementById('tasks-list');
      const emptyMessage = document.getElementById('empty-message');
      const lotteriesList = document.getElementById('lotteries-list');
      const lotteriesEmptyMessage = document.getElementById('lotteries-empty-message');
      const refreshBtn = document.getElementById('refresh-btn');

      loadAll();
      reloadAll = loadAll;

      refreshBtn.addEventListener('click', async () => {
        const icon = refreshBtn.querySelector('svg');
        if (icon) icon.classList.add('animate-spin');
        await loadAll();
        const liveIcon = refreshBtn.querySelector('svg');
        if (liveIcon) liveIcon.classList.remove('animate-spin');
      });

      async function loadAll() {
        await Promise.all([loadReferralInfo(), loadTasks(), loadLotteries()]);
      }

      async function loadLotteries() {
        lotteriesList.innerHTML = '<div class="p-6 text-center text-sm text-gray-400">Загрузка...</div>';
        try {
          const lotteries = await callServer('getLotteriesList');
          renderLotteries(lotteries);
        } catch (error) {
          lotteriesList.innerHTML = `<div class="p-6 text-center text-sm text-red-500">Ошибка загрузки: ${error.message}</div>`;
        }
      }

      function renderLotteries(lotteries) {
        lotteriesList.innerHTML = '';
        if (lotteries.length === 0) {
          lotteriesEmptyMessage.classList.remove('hidden');
          return;
        }
        lotteriesEmptyMessage.classList.add('hidden');
        lotteries.forEach(l => lotteriesList.appendChild(buildLotteryCard(l)));
        lucide.createIcons();
      }

      function buildLotteryCard(l) {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-3';

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="font-semibold text-gray-900 text-[15px]">${escapeHtmlClient(l.title)}</div>
          </div>
          ${l.prize ? `<div class="text-[13px] text-gray-500 mt-1">Приз: ${escapeHtmlClient(l.prize)}</div>` : ''}
          <div class="text-[12px] text-gray-400 mt-2">Участников: ${l.participantCount}</div>
        `;

        if (l.alreadyJoined) {
          const badge = document.createElement('div');
          badge.className = 'mt-3 w-full py-2 rounded-xl bg-green-50 text-green-700 text-xs font-medium text-center';
          badge.textContent = 'Вы участвуете';
          card.appendChild(badge);
        } else if (l.conditionMet) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'mt-3 w-full py-2 rounded-xl bg-indigo-600 text-white text-xs font-medium';
          btn.textContent = 'Участвовать';
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            try {
              await callServer('joinLottery', l.lotteryId);
              showSaveToast(true, 'Вы участвуете в розыгрыше');
              loadLotteries();
            } catch (error) {
              btn.disabled = false;
              showSaveToast(false, `Не удалось: ${error.message}`);
            }
          });
          card.appendChild(btn);
        } else {
          const hint = document.createElement('div');
          hint.className = 'mt-3 text-[12px] text-gray-500';
          hint.textContent = l.taskTitle ? `Сначала выполните задание: «${l.taskTitle}»` : 'Условие входа пока не выполнено.';
          card.appendChild(hint);
        }

        return card;
      }

      async function loadReferralInfo() {
        try {
          const info = await callServer('getReferralInfo');
          document.getElementById('sovy-progress-label').textContent = `${info.balance.sovyProgress}/100`;
          document.getElementById('sovy-progress-bar').style.width = `${info.balance.sovyProgress}%`;
          document.getElementById('tickets-count').textContent = info.balance.tickets;

          const referralText = document.getElementById('referral-text');
          const referralInput = document.getElementById('referral-link-input');
          if (info.link) {
            referralText.textContent = `Друг получит ${info.inviteeReward} сов сразу, а вы — ${info.referrerReward} сов за его первый оплаченный заказ.`;
            referralInput.value = info.link;
          } else {
            referralText.textContent = 'Не удалось собрать ссылку, попробуйте обновить страницу.';
            referralInput.value = '';
          }
        } catch (error) {
          document.getElementById('referral-text').textContent = `Ошибка загрузки: ${error.message}`;
        }
      }

      async function loadTasks() {
        tasksList.innerHTML = '<div class="p-6 text-center text-sm text-gray-400">Загрузка...</div>';
        try {
          const tasks = await callServer('getTasksList');
          renderTasks(tasks);
        } catch (error) {
          tasksList.innerHTML = `<div class="p-6 text-center text-sm text-red-500">Ошибка загрузки: ${error.message}</div>`;
        }
      }

      function renderTasks(tasks) {
        tasksList.innerHTML = '';
        if (tasks.length === 0) {
          emptyMessage.classList.remove('hidden');
          return;
        }
        emptyMessage.classList.add('hidden');
        tasks.forEach(t => tasksList.appendChild(buildTaskCard(t)));
        lucide.createIcons();
      }

      function buildTaskCard(t) {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-3';

        const statusBadges = {
          done: '<span class="text-[10px] px-2 py-0.5 rounded-full bg-green-100 text-green-700">Выполнено</span>',
          pending: '<span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">На проверке</span>',
          rejected: '<span class="text-[10px] px-2 py-0.5 rounded-full bg-red-100 text-red-700">Отклонено</span>',
          not_done: '<span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">Не выполнено</span>',
        };

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="font-semibold text-gray-900 text-[15px]">${escapeHtmlClient(t.title)}</div>
            ${statusBadges[t.status] || ''}
          </div>
          ${t.description ? `<div class="text-[13px] text-gray-500 mt-1">${escapeHtmlClient(t.description)}</div>` : ''}
          <div class="text-[12px] text-indigo-600 mt-2 font-medium">+${t.reward} сов</div>
        `;

        if (t.type === 'Ручное' && (t.status === 'not_done' || t.status === 'rejected')) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'mt-3 w-full py-2 rounded-xl bg-indigo-600 text-white text-xs font-medium';
          btn.textContent = t.status === 'rejected' ? 'Отправить снова' : 'Отправить на проверку';
          btn.addEventListener('click', () => openProofModal(t));
          card.appendChild(btn);
        }

        return card;
      }
    }

    // --- Модалка отправки доказательства ---
    const proofModal = document.getElementById('proof-modal');
    const proofTextInput = document.getElementById('proof-text-input');
    const proofErrorText = document.getElementById('proof-error-text');
    let submittingTaskId = null;

    function openProofModal(task) {
      submittingTaskId = task.taskId;
      proofTextInput.value = '';
      proofErrorText.classList.add('hidden');
      document.getElementById('proof-modal-title').textContent = task.title;
      document.getElementById('proof-modal-description').textContent = task.description || '';
      proofModal.classList.remove('hidden');
      proofModal.classList.add('flex');
    }

    function closeProofModal() {
      proofModal.classList.add('hidden');
      proofModal.classList.remove('flex');
      submittingTaskId = null;
    }
    document.getElementById('proof-modal-close').addEventListener('click', closeProofModal);
    document.getElementById('proof-modal-cancel').addEventListener('click', closeProofModal);

    const proofModalSaveBtn = document.getElementById('proof-modal-save');
    proofModalSaveBtn.addEventListener('click', async () => {
      proofErrorText.classList.add('hidden');
      const text = proofTextInput.value.trim();
      if (text === '') {
        proofErrorText.textContent = 'Добавьте текст или ссылку.';
        proofErrorText.classList.remove('hidden');
        return;
      }

      // Блокируем кнопку на время запроса — защита от повторного клика/медленной сети.
      proofModalSaveBtn.disabled = true;
      try {
        await callServer('submitTaskProof', submittingTaskId, text);
        closeProofModal();
        showSaveToast(true, 'Отправлено на проверку');
        if (reloadAll) reloadAll();
      } catch (error) {
        proofErrorText.textContent = error.message;
        proofErrorText.classList.remove('hidden');
      } finally {
        proofModalSaveBtn.disabled = false;
      }
    });

    document.getElementById('copy-referral-btn').addEventListener('click', async () => {
      const input = document.getElementById('referral-link-input');
      if (!input.value) return;
      try {
        await navigator.clipboard.writeText(input.value);
        showSaveToast(true, 'Ссылка скопирована');
      } catch (error) {
        input.select();
        showSaveToast(false, 'Не удалось скопировать — выделите ссылку вручную');
      }
    });

    function showSaveToast(success, message) {
      const toast = document.getElementById('save-toast');
      const inner = document.getElementById('save-toast-inner');
      inner.textContent = message;
      inner.className = success
        ? 'rounded-xl px-4 py-3 text-sm font-medium text-center shadow-md bg-green-50 text-green-700 border border-green-200'
        : 'rounded-xl px-4 py-3 text-sm font-medium text-center shadow-md bg-red-50 text-red-700 border border-red-200';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }
  </script>
</body>

</html>
