<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Кнопка</title>
</head>
<body>
  <!-- Заглушка-редирект (Phase 2 SPA, 02.08.2026) — страница объединена в
       app.html#/order-details/<orderId>. orderId переносится из старого
       формата ?orderId=... в новый маршрут. Оставлена на случай старых
       закладок/ссылок (например, из истории Telegram-уведомлений). -->
  <script>
    const orderId = new URLSearchParams(window.location.search).get('orderId');
    window.location.replace('app.html#/order-details/' + encodeURIComponent(orderId || ''));
  </script>
</body>
</html>
