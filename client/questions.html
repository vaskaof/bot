<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Мои вопросы</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="../config.js?v=2"></script>
  <script src="../common.js?v=2"></script>
  <style>
    body {
      background-color: #f3f4f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 80px;
    }
  </style>
</head>

<body class="text-gray-800">
  <div id="loading-screen" class="fixed inset-0 bg-[#f3f4f9] flex items-center justify-center z-50">
    <div class="text-gray-400 text-sm">Загрузка...</div>
  </div>

  <div id="access-denied-screen" class="fixed inset-0 bg-[#f3f4f9] hidden items-center justify-center z-50 px-6">
    <div class="text-center" style="font-family: monospace; font-size: 12px; word-break: break-all; text-align: left;">
      <p><b>Доступ не подтверждён.</b></p>
      <p id="debug-init-data"></p>
    </div>
  </div>

  <div id="app-content" class="hidden">
    <header class="fixed top-0 left-0 right-0 h-14 bg-[#f3f4f9] bg-opacity-90 backdrop-blur-md z-40 flex items-center justify-between px-4">
      <h1 class="text-lg font-semibold text-gray-900 tracking-tight">Мои вопросы</h1>
      <button id="refresh-btn" class="p-2 text-indigo-600 rounded-full hover:bg-white/50 transition-colors">
        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
      </button>
    </header>

    <main class="pt-16 pb-6 px-4 md:px-0 max-w-2xl mx-auto">
      <div id="questions-list"></div>
      <div id="empty-message" class="hidden text-center text-sm text-gray-400 py-10">
        Вы ещё не задавали вопросов по заказам.
      </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 pb-safe pt-1 px-1 flex justify-between items-end z-40 h-[70px] shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
      <a href="news.html" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="home" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Главная</span>
      </a>
      <a href="questions.html" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-indigo-600 pb-2 h-full">
        <i data-lucide="help-circle" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Вопросы</span>
      </a>
      <a href="wishlist.html" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="heart" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Вишлист</span>
      </a>
      <a href="orders.html" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="package" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Заказы</span>
      </a>
    </nav>
  </div>

  <script>
    lucide.createIcons();
    initClientAccess(initApp);

    function initApp() {
      const listContainer = document.getElementById('questions-list');
      const emptyMessage = document.getElementById('empty-message');
      const refreshBtn = document.getElementById('refresh-btn');

      loadQuestions();

      refreshBtn.addEventListener('click', () => {
        const icon = refreshBtn.querySelector('svg');
        if (icon) icon.classList.add('animate-spin');
        loadQuestions().finally(() => {
          const liveIcon = refreshBtn.querySelector('svg');
          if (liveIcon) liveIcon.classList.remove('animate-spin');
        });
      });

      async function loadQuestions() {
        listContainer.innerHTML = '<div class="p-6 text-center text-sm text-gray-400">Загрузка...</div>';
        try {
          const questions = await callServer('getClientQuestionsList');
          render(questions);
        } catch (error) {
          listContainer.innerHTML = `<div class="p-6 text-center text-sm text-red-500">Ошибка загрузки: ${error.message}</div>`;
        }
      }

      function render(questions) {
        listContainer.innerHTML = '';

        if (questions.length === 0) {
          emptyMessage.classList.remove('hidden');
          return;
        }
        emptyMessage.classList.add('hidden');

        questions.forEach(q => listContainer.appendChild(buildCard(q)));
      }

      function buildCard(q) {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-3';

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="font-semibold text-gray-900 text-[15px]">${escapeHtmlClient(q.productDisplay)}</div>
            <div class="text-[11px] text-gray-400 shrink-0">${escapeHtmlClient(q.createdAtDisplay)}</div>
          </div>
          <div class="text-[14px] text-gray-700 mt-2">${escapeHtmlClient(q.text)}</div>
          ${q.status === 'Отвечено'
            ? `<div class="mt-2 p-2.5 rounded-xl bg-indigo-50 border border-indigo-100 text-[13px] text-indigo-800"><b>Ответ менеджера:</b> ${escapeHtmlClient(q.answer)}</div>`
            : `<div class="mt-2 text-[12px] text-amber-500 font-medium">Ожидает ответа</div>`}
        `;
        return card;
      }
    }
  </script>
</body>

</html>
