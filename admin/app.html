<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Кнопка — панель</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="../config.js?v=4"></script>
  <script src="../common.js?v=19"></script>
  <script src="router.js?v=13"></script>
  <script src="screens/_form-helpers.js?v=5"></script>
  <script src="screens/_sku-modal.js?v=14"></script>
  <script src="screens/_manual-client-modal.js?v=1"></script>
  <script src="screens/_delete-order-modal.js?v=2"></script>
  <script src="screens/_collective-picker-modal.js?v=2"></script>
  <script src="screens/_delivery-status-modal.js?v=2"></script>
  <script src="screens/_purchase-event-modal.js?v=2"></script>
  <script src="screens/_writeoff-modal.js?v=2"></script>
  <script src="screens/wishlist-demand.js?v=9"></script>
  <script src="screens/wallet.js?v=7"></script>
  <script src="screens/staff.js?v=3"></script>
  <script src="screens/home.js?v=3"></script>
  <script src="screens/more.js?v=3"></script>
  <script src="screens/clients.js?v=5"></script>
  <script src="screens/analytics.js?v=2"></script>
  <script src="screens/reminders.js?v=2"></script>
  <script src="screens/orders.js?v=13"></script>
  <script src="screens/deleted-orders.js?v=3"></script>
  <script src="screens/catalog.js?v=9"></script>
  <script src="screens/collectives.js?v=8"></script>
  <script src="screens/collective-detail.js?v=8"></script>
  <script src="screens/contests.js?v=9"></script>
  <script src="screens/order-new.js?v=16"></script>
  <script src="screens/order-edit.js?v=23"></script>
  <script src="screens/payments.js?v=14"></script>
  <script src="screens/settings.js?v=12"></script>
  <!-- Фича «Лот»/«Корзина» (delegated-spinning-rabbit.md, 02.09.2026) -->
  <script src="screens/lots.js?v=1"></script>
  <script src="screens/lot-new.js?v=5"></script>
  <script src="screens/lot-detail.js?v=2"></script>
  <!-- Рефакторинг «Корзина», фаза 3 (REFACTOR-CART.md §4, 03.09.2026);
       слияние «Новый заказ»→«Корзина» (05.09.2026, IMPLEMENTATION-PLAN-
       CART-MERGE.md) -->
  <script src="screens/cart-new.js?v=3"></script>
  <style>
    body {
      background-color: #f3f4f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 80px;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      z-index: 50;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #f3f4f6;
    }
    .dropdown-menu.active { display: block; }
    /* Индикатор "идёт сохранение" (13.08.2026, по фидбеку VASY) —
       вращение (animate-spin) на иконке дискеты выглядело странно, заменено
       пульсацией (масштаб, как сердцебиение), используется на save-order-btn
       в order-new.js/order-edit.js на время запроса. */
    @keyframes save-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }
    .save-pulse { animation: save-pulse 0.7s ease-in-out infinite; }
    /* Отступ под системную зону iPhone (Home Indicator) — ИСПРАВЛЕНО
       19.08.2026, тот же баг и то же исправление, что client/app.html:
       `pb-safe` не входит в базовую сборку Tailwind CDN (нет
       tailwind.config), никогда не давал реального отступа. */
    #bottom-nav {
      height: calc(70px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Панель массовых действий (Э3 рефакторинга коллективок, `orders.js`/
       `collective-detail.js` — общий id `bulk-actions-bar` на обоих экранах,
       один селектор правит оба) — `bottom-0` в разметке ставила её ПОД
       #bottom-nav (тот же bottom:0, z-40 у обоих — bottom-nav позже в DOM,
       перехватывал клики по нижним кнопкам панели). Найдено 25.08.2026 при
       e2e-тесте Э5 (delivery-status-gate.spec.js) — с 4-й кнопкой ("Сменить
       статус доставки", 2×2 grid) панель стала выше, перекрытие выросло с
       "почти незаметного" до блокирующего клики совсем. Поднимаем панель
       НАД навигацией — та же высота, что #bottom-nav сама себе выставляет. */
    #bulk-actions-bar {
      bottom: calc(70px + env(safe-area-inset-bottom));
    }
  </style>
</head>

<body class="text-gray-800">
  <div id="loading-screen" class="fixed inset-0 bg-[#f3f4f9] flex items-center justify-center z-50">
    <div class="text-gray-400 text-sm">Загрузка...</div>
  </div>

  <div id="access-denied-screen" class="fixed inset-0 bg-[#f3f4f9] hidden items-center justify-center z-50 px-6">
    <div class="text-center max-w-xs">
      <p class="text-base font-semibold text-gray-900">Не удалось загрузить приложение</p>
      <p class="text-sm text-gray-500 mt-2">Попробуйте обновить страницу. Если ошибка повторяется — сообщите разработчику.</p>
      <button type="button" id="access-denied-retry-btn" class="mt-4 px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium">Обновить страницу</button>
      <button type="button" id="access-denied-details-toggle" class="mt-3 text-xs text-gray-400 underline block mx-auto">Показать технические детали</button>
      <p id="debug-tg-exists" class="hidden"></p>
      <p id="debug-init-data" class="hidden mt-2 text-left" style="font-family: monospace; font-size: 11px; word-break: break-all;"></p>
    </div>
  </div>

  <div id="app-content" class="hidden">
    <!-- Общая шапка — живёт в шелле, НЕ пересоздаётся при смене экрана.
         Экран заполняет только #header-left/#header-actions в render(). -->
    <header id="screen-header" class="fixed top-0 left-0 right-0 h-14 bg-[#f3f4f9] bg-opacity-90 backdrop-blur-md z-40 flex items-center justify-between px-4">
      <div id="header-left" class="flex items-center min-w-0"></div>
      <div id="header-actions" class="flex items-center gap-1 shrink-0"></div>
    </header>

    <div id="save-toast" class="fixed top-16 left-4 right-4 z-50 hidden">
      <div id="save-toast-inner" class="rounded-xl px-4 py-3 text-sm font-medium text-center shadow-md"></div>
    </div>

    <!-- Экран владеет своим main/модалками — вставляется/заменяется
         router.renderRoute() при смене hash. -->
    <div id="screen-root"></div>

    <!-- Нижняя навигация (переработана 17.08.2026,
         project_bot_knopka_admin_bottom_nav_redesign) — 6 постоянных пунктов
         вместо 8: Новости+Вопросы слиты в "Главная" (screens/home.js,
         вкладки), Настройки/Конкурсы/Аналитика сворачиваются под "Ещё" на
         узком экране. Порядок — по прямому запросу VASY: "Главная" и
         "Напоминания" нарочно крайние слева (то, что должно бросаться в
         глаза администратору в первую очередь), рабочий конвейер
         Заказы→Каталог→Оплаты — следом, "Ещё" — последним.
         Настройки/Конкурсы/Аналитика ФИЗИЧЕСКИ есть в разметке всегда (не
         дублируются JS-ом под другим брейкпоинтом) — просто `hidden md:flex`
         показывает их только на широком экране (десктопный клиент Telegram
         может дать окну реальную ширину, там прятать их за "Ещё" уже не
         нужно — есть место), а кнопка "Ещё" на этой же ширине скрывается
         обратным правилом `md:hidden`. md соответствует Tailwind-дефолту
         768px — точного требования по брейкпоинту не было, это стартовое
         значение, не привязанное к измеренному узкому экрану реальных
         админов. -->
    <nav id="bottom-nav"
      class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 pt-1 px-1 flex justify-between items-end z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
      <button type="button" data-nav-key="home" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="home" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Главная</span>
      </button>
      <button type="button" data-nav-key="reminders" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="bell" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Напоминания</span>
      </button>
      <button type="button" data-nav-key="orders" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="list" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Заказы</span>
      </button>
      <button type="button" data-nav-key="catalog" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="layers" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Каталог</span>
      </button>
      <button type="button" data-nav-key="payments" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="wallet" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Оплаты</span>
      </button>

      <!-- Широкий экран: разворачиваются inline вместо "Ещё" -->
      <button type="button" data-nav-key="contests" class="hidden md:flex flex-1 flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="gift" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Конкурсы</span>
      </button>
      <button type="button" data-nav-key="settings" class="hidden md:flex flex-1 flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="settings" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Настройки</span>
      </button>
      <button type="button" data-nav-key="analytics" class="hidden md:flex flex-1 flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="bar-chart-2" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Аналитика</span>
      </button>
      <button type="button" data-nav-key="clients" class="hidden md:flex flex-1 flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="users" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Клиенты</span>
      </button>
      <!-- Э2 рефакторинга экономики, 25.08.2026 — "Кошелёк ₸" (wallet.js), тот же принцип, что остальные MORE_GROUP-кнопки выше. -->
      <button type="button" data-nav-key="wallet" class="hidden md:flex flex-1 flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="coins" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Кошелёк</span>
      </button>
      <!-- Фаза 2 (roles/RBAC, M2.3, 04.09.2026) — admin-only. Присутствует в
           разметке всегда (роль ещё не известна на этапе статического HTML),
           router.js прячет её для менеджера сразу после initAccessCheck —
           см. startAdminRouter. -->
      <button type="button" data-nav-key="staff" id="staff-nav-btn" class="hidden md:flex flex-1 flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="user-cog" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Персонал</span>
      </button>

      <!-- Узкий экран: сворачивает три кнопки выше под одну -->
      <button type="button" data-nav-key="more" class="md:hidden flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="more-horizontal" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Ещё</span>
      </button>
    </nav>
  </div>

  <script>
    startAdminRouter();
  </script>
</body>

</html>
