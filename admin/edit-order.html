<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Кнопка — панель</title>
</head>
<body>
  <!-- Заглушка-редирект (admin SPA, 02.08.2026) — страница объединена в
       app.html#/orders/<id>/edit. Оставлена на случай старых закладок/ссылок
       вида edit-order.html?orderId=XXX — параметр транслируется в route. -->
  <script>
    const orderId = new URLSearchParams(window.location.search).get('orderId') || '';
    window.location.replace('app.html#/orders/' + encodeURIComponent(orderId) + '/edit');
  </script>
</body>
</html>
