<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Вопросы</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="../config.js?v=4"></script>
  <script src="../common.js?v=4"></script>
  <style>
    body {
      background-color: #f3f4f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 80px;
    }
  </style>
</head>

<body class="text-gray-800">
  <div id="loading-screen" class="fixed inset-0 bg-[#f3f4f9] flex items-center justify-center z-50">
    <div class="text-gray-400 text-sm">Загрузка...</div>
  </div>

  <div id="access-denied-screen" class="fixed inset-0 bg-[#f3f4f9] hidden items-center justify-center z-50 px-6">
    <div class="text-center" style="font-family: monospace; font-size: 12px; word-break: break-all; text-align: left;">
      <p><b>Доступ не подтверждён.</b></p>
      <p id="debug-tg-exists"></p>
      <p id="debug-init-data"></p>
    </div>
  </div>

  <div id="app-content" class="hidden">
    <header
      class="fixed top-0 left-0 right-0 h-14 bg-[#f3f4f9] bg-opacity-90 backdrop-blur-md z-40 flex items-center justify-between px-4">
      <a href="javascript:history.back()" class="p-2 text-indigo-600 rounded-full hover:bg-white/50 transition-colors">
        <i data-lucide="arrow-left" class="w-6 h-6"></i>
      </a>
      <h1 class="text-lg font-semibold text-gray-900 tracking-tight">Вопросы</h1>
      <button id="refresh-questions" class="p-2 text-indigo-600 rounded-full hover:bg-white/50 transition-colors">
        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
      </button>
    </header>

    <main class="pt-16 pb-6 px-4 md:px-0 max-w-2xl mx-auto">
      <div class="text-[11px] text-gray-400 px-1 mb-2" id="questions-count"></div>
      <div id="questions-list"></div>
      <div id="empty-message" class="hidden text-center text-sm text-gray-400 py-10">Вопросов нет 🎉</div>
    </main>

    <nav
      class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 pb-safe pt-1 px-1 flex justify-between items-end z-40 h-[70px] shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
      <a href="news.html"
        class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="home" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Главная</span>
      </a>
      <a href="questions.html"
        class="flex-1 flex flex-col items-center justify-end gap-1.5 text-indigo-600 pb-2 h-full">
        <i data-lucide="help-circle" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Вопросы</span>
      </a>
      <a href="reminders.html"
        class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="bell" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Напоминания</span>
      </a>
      <a href="orders.html"
        class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="list" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Заказы</span>
      </a>
      <a href="catalog.html"
        class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="layers" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Каталог</span>
      </a>
      <a href="contests.html" class="flex-1 flex flex-col items-center justify-end gap-1.5 text-gray-400 hover:text-indigo-600 transition-colors pb-2 h-full">
        <i data-lucide="gift" class="w-[22px] h-[22px]"></i>
        <span class="text-[10px] font-medium leading-none">Конкурсы</span>
      </a>
    </nav>
  </div>

  <script>
    lucide.createIcons();
    initAccessCheck(initApp);

    function initApp() {
      const listContainer = document.getElementById('questions-list');
      const emptyMessage = document.getElementById('empty-message');
      const countLabel = document.getElementById('questions-count');
      const refreshBtn = document.getElementById('refresh-questions');

      loadQuestions();

      refreshBtn.addEventListener('click', async () => {
        const icon = refreshBtn.querySelector('svg');
        if (icon) icon.classList.add('animate-spin');
        await loadQuestions();
        const liveIcon = refreshBtn.querySelector('svg');
        if (liveIcon) liveIcon.classList.remove('animate-spin');
      });

      async function loadQuestions() {
        listContainer.innerHTML = '<div class="p-6 text-center text-sm text-gray-400">Загрузка...</div>';
        try {
          const questions = await callServer('getQuestionsList');
          render(questions);
        } catch (error) {
          listContainer.innerHTML = `<div class="p-6 text-center text-sm text-red-500">Ошибка загрузки: ${error.message}</div>`;
        }
      }

      function render(questions) {
        countLabel.textContent = `Найдено: ${questions.length}`;
        listContainer.innerHTML = '';

        if (questions.length === 0) {
          emptyMessage.classList.remove('hidden');
          return;
        }
        emptyMessage.classList.add('hidden');

        questions.forEach(q => listContainer.appendChild(buildCard(q)));
      }

      function buildCard(q) {
        const isNew = q.status === 'Новый';
        const card = document.createElement('div');
        card.className = `bg-white rounded-2xl shadow-sm border p-4 mb-3 ${isNew ? 'border-amber-300 bg-amber-50' : 'border-gray-100'}`;

        card.innerHTML = `
    <div class="cursor-pointer" data-open>
      <div class="flex items-start justify-between gap-2">
        <div>
          <div class="text-[11px] font-medium text-indigo-600 mb-0.5">${escapeHtmlClient(q.productDisplay)}</div>
          <div class="text-[13px] text-gray-500">${escapeHtmlClient(q.clientDisplay || 'Клиент не указан')}</div>
        </div>
        <div class="text-[11px] text-gray-400 shrink-0">${escapeHtmlClient(q.createdAtDisplay)}</div>
      </div>
      <div class="text-[14px] text-gray-800 mt-2">${escapeHtmlClient(q.text)}</div>
    </div>
    <div class="mt-3">
      <textarea class="answer-input w-full px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:border-indigo-400 resize-none" rows="2" placeholder="Введите ответ клиенту...">${escapeHtmlClient(q.answer)}</textarea>
      <button type="button" class="save-answer-btn mt-2 w-full py-2 rounded-xl bg-indigo-600 text-white text-xs font-medium">${isNew ? 'Отправить ответ' : 'Обновить ответ'}</button>
    </div>
  `;

        // Клик по товару/клиенту — переход к заказу. Поле ответа лежит СНАРУЖИ
        // этого блока (сосед, не вложенный элемент) — stopPropagation не нужен
        card.querySelector('[data-open]').addEventListener('click', () => {
          window.location.href = `edit-order.html?orderId=${encodeURIComponent(q.orderId)}`;
        });

        const saveBtn = card.querySelector('.save-answer-btn');
        const textarea = card.querySelector('.answer-input');
        saveBtn.addEventListener('click', async () => {
          const text = textarea.value.trim();
          if (text === '') {alert('Введите текст ответа.'); return;}

          saveBtn.disabled = true;
          saveBtn.textContent = 'Сохраняю...';
          try {
            await callServer('saveQuestionAnswer', q.questionId, text);
            loadQuestions();
          } catch (error) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Ошибка, повторить';
          }
        });

        return card;
      }
    }
  </script>
</body>

</html>
